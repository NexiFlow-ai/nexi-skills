[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "nexi-pack"
version = "0.1.0"
description = "Validate, digest, sign, verify and scaffold Nexi packs — skills, agents, Flows and the blueprint layer that ship them."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [{ name = "NexiFlow" }]
keywords = ["nexi", "agents", "skills", "flows", "packs"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Libraries",
]
dependencies = [
  "jsonschema>=4.18",
  "referencing>=0.30",
  "cryptography>=42",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
nexi-pack = "nexi_pack.cli:main"

[project.urls]
Homepage = "https://github.com/NexiFlow-ai/nexi-skills"
Documentation = "https://docs.nexiflow.ai/docs/"

[tool.hatch.build.targets.wheel]
packages = ["src/nexi_pack"]

[tool.hatch.build.targets.sdist]
include = ["src/nexi_pack", "README.md", "pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
